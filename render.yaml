services:
  - type: web
    name: crime-detection-api
    env: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MODEL_DIR
        value: /app/model
      - key: CORS_ORIGINS
        value: "*"
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: crime_detection
