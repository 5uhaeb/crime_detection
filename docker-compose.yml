services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MODEL_DIR: /app/model
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
